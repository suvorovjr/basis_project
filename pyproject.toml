[project]
name = "basis-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "dishka==1.10.1",
    "dishka-faststream==0.7.0",
    "fastapi==0.162.0",
    "faststream[rabbit]==0.7.8",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.0.49",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "ruff==0.17.3",
]

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ERA"]
